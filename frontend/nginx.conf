# Nginx config for the Hestia-MediaManager frontend container.
#
# Single virtual host on port 80:
#   * /api/*  proxied to the backend service ("backend:8000" - the
#             docker-compose service name).
#   * /ws/*   proxied with WebSocket upgrade headers.
#   * everything else  served from the compiled React bundle in
#                     /usr/share/nginx/html, with SPA fallback to
#                     index.html so client-side routes resolve on
#                     hard refresh.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static-asset cache hint - Vite emits content-hashed filenames,
    # so anything under /assets/ can be cached forever by the browser.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large request bodies (e.g. log file downloads) - match the
        # 4 MB cap inside server/log_browser.py with some slack.
        client_max_body_size 16M;
        proxy_read_timeout 300;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # WebSocket connections sit idle between snapshots while a
        # job isn't running - keep them open for an hour.
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # SPA fallback - any unknown path serves the React shell so
    # client-side routing (deep links, hard reloads) works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
